[project]
name = "github-chat"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "adalflow>=1.1.3",
    "fastapi>=0.128.0",
    "fastembed>=0.4.0",
    "google-genai>=1.57.0",
    "google-generativeai>=0.8.6",
    "groq>=1.0.0",
    "memori>=3.3.6",
    "mlflow>=3.8.1",
    "openai>=2.15.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.13.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "streamlit>=1.52.2",
    "uvicorn>=0.40.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["..", "."]

